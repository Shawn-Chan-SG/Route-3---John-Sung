<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SBG Mission Event 2026 — Route 3: John Sung Trail</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="site-header">
    <img class="site-logo" src="assets/images/mm-logo.png" alt="Mission logo" />
    <span class="emoji">🌿</span>
    <h1 id="siteTitle">Great Commission Quest</h1>
    <p id="routeLine">Route 3: John Sung &middot; The China Challenge</p>
    <p id="eventLine">Singapore Botanic Gardens &middot; Mission Trip Fundraiser 2026</p>
  </div>
  <div class="wrap">
    <div class="top-actions index-top-actions">
      <span></span>
      <button type="button" class="lang-toggle" id="langToggle">中文</button>
    </div>
    <div id="teamList" class="team-list"></div>
    <p class="index-note" id="indexNote">Tap your team's link to start the race</p>
  </div>
  <div class="site-footer" id="siteFooter">Route 3 &middot; John Sung &middot; Singapore Botanic Gardens Mission Trip Fundraiser 2026</div>

  <script src="assets/data.js"></script>
  <script>
    (function () {
      function renderPage() {
        document.title = t("pageTitleIndex");
        document.getElementById("siteTitle").innerHTML = t("siteTitle");
        document.getElementById("routeLine").innerHTML = t("routeLine");
        document.getElementById("eventLine").innerHTML = t("eventLine");
        document.getElementById("indexNote").innerHTML = t("indexNote");
        document.getElementById("siteFooter").innerHTML = t("footerIndex");
        document.getElementById("langToggle").textContent = t("langToggle");

        const list = document.getElementById("teamList");
        let html = "";
        Object.keys(TEAMS).forEach((teamId) => {
          const team = TEAMS[teamId];
          const seqText = team.sequence.map((n) => "CP" + n).join(" &rarr; ");
          html += `
            <a class="team-row" href="Team%20${teamId}.html">
              <span class="team-row-text">
                <span class="team-row-name">${teamLabel(team)}</span>
                <span class="team-row-seq">${seqText}</span>
              </span>
              <span class="team-row-chevron">&rsaquo;</span>
            </a>`;
        });
        list.innerHTML = html;
      }

      document.getElementById("langToggle").addEventListener("click", () => {
        setLang(getLang() === "zh" ? "en" : "zh");
        renderPage();
      });

      renderPage();
    })();
  </script>
</body>
</html>
